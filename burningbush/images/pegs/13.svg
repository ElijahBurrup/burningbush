<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<!-- 13 = Dime (US ten-cent coin) -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16402a"/><stop offset="1" stop-color="#092115"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#ffcf4d"/><stop offset=".8" stop-color="#ff8a1e"/><stop offset="1" stop-color="#e0561a"/></linearGradient>
</defs>
<rect width="96" height="96" rx="22" fill="url(#bg)"/>
<circle cx="48" cy="48" r="27" fill="url(#g)"/>
<circle cx="48" cy="48" r="21" fill="none" stroke="#0e2c1d" stroke-width="2"/>
<text x="48" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="21" fill="#0e2c1d">10¢</text>
