<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<!-- 51 = Colossians : a mighty colossus statue, strong and powerful -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#ffcf4d"/><stop offset=".8" stop-color="#ff8a1e"/><stop offset="1" stop-color="#e0561a"/></linearGradient>
</defs>
<!-- pedestal -->
<rect x="24" y="84" width="48" height="8" rx="2" fill="url(#g)"/>
<rect x="30" y="78" width="36" height="6" fill="url(#g)"/>
<!-- head -->
<circle cx="48" cy="16" r="8" fill="url(#g)"/>
<!-- broad muscular torso -->
<path d="M32 34 q16 -9 32 0 l-3 15 q2 15 -3 29 l-20 0 q-5 -14 -3 -29 z" fill="url(#g)" stroke="#0e2c1d" stroke-width="1.5" stroke-linejoin="round"/>
<!-- flexed left arm -->
<path d="M33 35 q-11 3 -14 15 q-1 8 5 12 l5 -4 q-5 -5 -3 -11 q2 -7 10 -8 z" fill="url(#g)" stroke="#0e2c1d" stroke-width="1.4" stroke-linejoin="round"/>
<!-- flexed right arm -->
<path d="M63 35 q11 3 14 15 q1 8 -5 12 l-5 -4 q5 -5 3 -11 q-2 -7 -10 -8 z" fill="url(#g)" stroke="#0e2c1d" stroke-width="1.4" stroke-linejoin="round"/>
<!-- legs -->
<path d="M40 76 l-2 2 h8 v-2 z" fill="url(#g)"/>
<path d="M56 76 l2 2 h-8 v-2 z" fill="url(#g)"/>
<!-- muscle definition -->
<path d="M48 40 v34 M40 46 q8 5 16 0 M40 58 q8 4 16 0" fill="none" stroke="#0e2c1d" stroke-width="1.5"/>
</svg>
