<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<!-- 66 = Revelation : the white horse (Rev 19) -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#ffcf4d"/><stop offset=".8" stop-color="#ff8a1e"/><stop offset="1" stop-color="#e0561a"/></linearGradient>
</defs>
<!-- rays of glory behind -->
<g stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
<line x1="70" y1="24" x2="80" y2="14"/>
<line x1="78" y1="34" x2="90" y2="30"/>
<line x1="60" y1="18" x2="64" y2="6"/>
</g>
<!-- tail -->
<path d="M20 44 q-10 2 -13 16 q7 -3 9 -8 q0 7 -3 12 q8 -4 11 -14 z" fill="url(#g)"/>
<!-- horse body + head, prancing profile -->
<path d="M18 46 q4 -12 18 -14 q4 -10 12 -14 q3 -5 8 -4 q1 4 -2 7 q6 2 8 8 q9 3 12 12 q-3 4 -8 3 l-1 6 l5 14 l-7 0 l-5 -13 q-8 2 -16 0 l4 13 l-7 0 l-4 -13 q-9 -2 -13 -8 l-3 8 l-6 -3 z" fill="#ffffff" stroke="#0e2c1d" stroke-width="2" stroke-linejoin="round"/>
<!-- mane -->
<path d="M50 16 q9 1 11 9 q-4 -2 -8 -1 q4 3 5 9 q-4 -2 -8 0 q3 3 3 8 l-6 -2 z" fill="url(#g)" stroke="#0e2c1d" stroke-width="1.2" stroke-linejoin="round"/>
<!-- ear + eye -->
<path d="M56 20 l3 -7 l3 6 z" fill="#ffffff" stroke="#0e2c1d" stroke-width="1.2"/>
<circle cx="60" cy="26" r="1.8" fill="#0e2c1d"/>
</svg>
