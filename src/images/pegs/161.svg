<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
<!-- 161 = Digit : a hand with one raised index finger -->
<defs>
<linearGradient id="sk161" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffddb0"/><stop offset=".55" stop-color="#f2b877"/><stop offset="1" stop-color="#d98f4c"/></linearGradient>
</defs>
<!-- wrist -->
<rect x="40" y="72" width="20" height="16" rx="6" fill="url(#sk161)" stroke="#0e2c1d" stroke-width="2"/>
<!-- raised index finger -->
<rect x="44" y="15" width="12" height="36" rx="6" fill="url(#sk161)" stroke="#0e2c1d" stroke-width="2"/>
<!-- thumb out to the side -->
<path d="M35 56 C27 56 21 60 21 66 C21 71 26 72 30 68 C33 65 36 62 38 60 Z" fill="url(#sk161)" stroke="#0e2c1d" stroke-width="2" stroke-linejoin="round"/>
<!-- fist / folded fingers -->
<rect x="33" y="46" width="30" height="30" rx="12" fill="url(#sk161)" stroke="#0e2c1d" stroke-width="2"/>
<!-- curled finger grooves (the other three fingers) -->
<g fill="none" stroke="#0e2c1d" stroke-width="1.5" opacity=".45" stroke-linecap="round">
<path d="M52 50 v9"/><path d="M57 51 v8"/><path d="M61 53 v6"/>
<path d="M36 64 q13 4 24 0"/>
</g>
</svg>
