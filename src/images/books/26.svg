<circle cx="48" cy="48" r="1.6" fill="#0e2c1d"/>
<!-- eyes on the rim -->
<g fill="#fff" stroke="#0e2c1d" stroke-width="1.4"><circle cx="69" cy="27" r="2.6"/><circle cx="27" cy="27" r="2.6"/><circle cx="27" cy="69" r="2.6"/><circle cx="69" cy="69" r="2.6"/></g>
<g fill="#0e2c1d"><circle cx="69" cy="27" r="1"/><circle cx="27" cy="27" r="1"/><circle cx="27" cy="69" r="1"/><circle cx="69" cy="69" r="1"/></g>
