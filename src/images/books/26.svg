<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
<!-- 26 = Ezekiel : a wheel within a wheel -->
<defs>
<linearGradient id="g26" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#ffcf4d"/><stop offset=".8" stop-color="#ff8a1e"/><stop offset="1" stop-color="#e0561a"/></linearGradient>
</defs>
<!-- spokes : dark then gold -->
<g stroke="#0e2c1d" stroke-width="4.5" stroke-linecap="round">
<line x1="64" y1="48" x2="77" y2="48"/><line x1="59" y1="59" x2="69" y2="69"/><line x1="48" y1="64" x2="48" y2="77"/><line x1="37" y1="59" x2="27" y2="69"/><line x1="32" y1="48" x2="19" y2="48"/><line x1="37" y1="37" x2="27" y2="27"/><line x1="48" y1="32" x2="48" y2="19"/><line x1="59" y1="37" x2="69" y2="27"/>
<line x1="54" y1="48" x2="60" y2="48"/><line x1="52" y1="52" x2="57" y2="57"/><line x1="48" y1="54" x2="48" y2="60"/><line x1="44" y1="52" x2="39" y2="57"/><line x1="42" y1="48" x2="36" y2="48"/><line x1="44" y1="44" x2="39" y2="39"/><line x1="48" y1="42" x2="48" y2="36"/><line x1="52" y1="44" x2="57" y2="39"/>
</g>
<g stroke="url(#g26)" stroke-width="2.6" stroke-linecap="round">
<line x1="64" y1="48" x2="77" y2="48"/><line x1="59" y1="59" x2="69" y2="69"/><line x1="48" y1="64" x2="48" y2="77"/><line x1="37" y1="59" x2="27" y2="69"/><line x1="32" y1="48" x2="19" y2="48"/><line x1="37" y1="37" x2="27" y2="27"/><line x1="48" y1="32" x2="48" y2="19"/><line x1="59" y1="37" x2="69" y2="27"/>
<line x1="54" y1="48" x2="60" y2="48"/><line x1="52" y1="52" x2="57" y2="57"/><line x1="48" y1="54" x2="48" y2="60"/><line x1="44" y1="52" x2="39" y2="57"/><line x1="42" y1="48" x2="36" y2="48"/><line x1="44" y1="44" x2="39" y2="39"/><line x1="48" y1="42" x2="48" y2="36"/><line x1="52" y1="44" x2="57" y2="39"/>
</g>
<!-- outer rim -->
<circle cx="48" cy="48" r="30" fill="none" stroke="#0e2c1d" stroke-width="10"/>
<circle cx="48" cy="48" r="30" fill="none" stroke="url(#g26)" stroke-width="7"/>
<!-- inner rim -->
<circle cx="48" cy="48" r="13" fill="none" stroke="#0e2c1d" stroke-width="9"/>
<circle cx="48" cy="48" r="13" fill="none" stroke="url(#g26)" stroke-width="6"/>
